<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Rombasen</title>
<meta name="description" content="To rolige romspill for de minste: hell drivstoff mellom tanker, eller fyll stjernebildene med riktig farge.">
<meta name="theme-color" content="#0b1e3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ========== HUB ========== -->
<div id="side-hub" class="side">
  <div class="stjernefelt"></div>
  <div class="hub-planet a"></div>
  <div class="hub-planet b"></div>

  <div class="hub">
    <h1 class="hub-tittel">ROMBASEN</h1>
    <p class="hub-undertittel">Velg spillet ditt!</p>

    <div class="hub-kort-rad">
      <button id="knappStartDrivstoff" class="spillkort glass a">
        <svg width="112" height="134" viewBox="0 0 112 134">
          <clipPath id="hkClip"><rect x="26" y="20" width="60" height="100" rx="28"/></clipPath>
          <rect x="26" y="20" width="60" height="100" rx="28" fill="#eaf4ff" stroke="#0b1e3d" stroke-width="4"/>
          <g clip-path="url(#hkClip)">
            <rect x="26" y="90" width="60" height="30" fill="#3d8bfd"/>
            <rect x="26" y="60" width="60" height="30" fill="#ffc857"/>
            <rect x="26" y="30" width="60" height="30" fill="#ff8a5b"/>
          </g>
          <rect x="26" y="20" width="60" height="100" rx="28" fill="none" stroke="#0b1e3d" stroke-width="4"/>
          <path d="M 16 104 L 2 128 L 16 120 Z" fill="#ff8a5b" stroke="#0b1e3d" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M 96 104 L 110 128 L 96 120 Z" fill="#ff8a5b" stroke="#0b1e3d" stroke-width="3.5" stroke-linejoin="round"/>
        </svg>
        <span class="spillkort-tittel">Drivstoff-sortering</span>
        <span class="spillkort-under">Hell riktig farge i riktig tank</span>
      </button>

      <button id="knappStartStjerner" class="spillkort glass b">
        <svg width="130" height="120" viewBox="0 0 130 120">
          <path d="M20,90 L45,30 L70,70 L95,20 L112,55" fill="none" stroke="#8ecbff" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.7"/>
          <path d="M20,90 C22,98 24,100 32,102 C24,104 22,106 20,114 C18,106 16,104 8,102 C16,100 18,98 20,90 Z" fill="#ffc857"/>
          <path d="M45,30 C47,36 48,37 54,39 C48,41 47,42 45,48 C43,42 42,41 36,39 C42,37 43,36 45,30 Z" fill="#ffc857"/>
          <path d="M70,70 C72,78 74,80 82,82 C74,84 72,86 70,94 C68,86 66,84 58,82 C66,80 68,78 70,70 Z" fill="#8ecbff"/>
          <path d="M95,20 C97,26 98,27 104,29 C98,31 97,32 95,38 C93,32 92,31 86,29 C92,27 93,26 95,20 Z" fill="#8ecbff"/>
          <path d="M112,55 C113,60 114,61 119,63 C114,65 113,66 112,71 C111,66 110,65 105,63 C110,61 111,60 112,55 Z" fill="#ff8a5b"/>
        </svg>
        <span class="spillkort-tittel">Stjernesamling</span>
        <span class="spillkort-under">Fyll stjernebildene</span>
      </button>
    </div>

    <div class="hub-snart">
      <div class="hub-snart-tekst">Flere spill kommer snart</div>
      <div class="hub-snart-rad">
        <div class="hub-snart-sirkel"><svg width="16" height="16" viewBox="0 0 18 18"><rect x="4" y="8" width="10" height="8" rx="2" fill="none" stroke="#9fb3d6" stroke-width="2"/><path d="M6,8 V5 a3,3 0 0 1 6,0 v3" fill="none" stroke="#9fb3d6" stroke-width="2"/></svg></div>
        <div class="hub-snart-sirkel"><svg width="16" height="16" viewBox="0 0 18 18"><rect x="4" y="8" width="10" height="8" rx="2" fill="none" stroke="#9fb3d6" stroke-width="2"/><path d="M6,8 V5 a3,3 0 0 1 6,0 v3" fill="none" stroke="#9fb3d6" stroke-width="2"/></svg></div>
        <div class="hub-snart-sirkel"><svg width="16" height="16" viewBox="0 0 18 18"><rect x="4" y="8" width="10" height="8" rx="2" fill="none" stroke="#9fb3d6" stroke-width="2"/><path d="M6,8 V5 a3,3 0 0 1 6,0 v3" fill="none" stroke="#9fb3d6" stroke-width="2"/></svg></div>
      </div>
    </div>
  </div>

  <svg class="hub-mascot" viewBox="0 0 130 120">
    <ellipse cx="70" cy="90" rx="46" ry="30" fill="#eaf4ff" stroke="#0b1e3d" stroke-width="4"/>
    <path d="M 70 30 C 40 30 30 65 40 92 L 100 92 C 110 65 100 30 70 30 Z" fill="#eaf4ff" stroke="#0b1e3d" stroke-width="4"/>
    <circle cx="70" cy="58" r="14" fill="#3d8bfd" stroke="#0b1e3d" stroke-width="3.5"/>
    <circle cx="65" cy="56" r="2.6" fill="#0b1e3d"/>
    <circle cx="76" cy="56" r="2.6" fill="#0b1e3d"/>
    <path d="M64,62 Q70,67 77,62" fill="none" stroke="#0b1e3d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 30 78 L 10 68 L 18 90 Z" fill="#ff8a5b" stroke="#0b1e3d" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 110 78 L 130 68 L 122 90 Z" fill="#ff8a5b" stroke="#0b1e3d" stroke-width="3.5" stroke-linejoin="round"/>
  </svg>

  <button id="knappLydHub" class="rundknapp glass" style="position:absolute; top:max(20px, env(safe-area-inset-top)); right:16px;" title="Lyd av eller på" aria-label="Lyd av eller på">
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3,7 h3 l5,-4 v14 l-5,-4 h-3 z" fill="#fff"/><path id="lydBuer" d="M14,6 a5,5 0 0 1 0,8 M16.3,4 a8,8 0 0 1 0,12" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- ========== DRIVSTOFF-SORTERING ========== -->
<div id="side-drivstoff" class="side skjult">
  <div class="stjernefelt"></div>
  <div class="spillside">
    <header class="topp">
      <button id="knappTilbakeDrivstoff" class="rundknapp glass knapp-tilbake" title="Tilbake til rombasen" aria-label="Tilbake til rombasen">
        <svg width="18" height="18" viewBox="0 0 20 20"><path d="M13,3 L5,10 L13,17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nivaamerke glass"><strong id="nivaaTallDrivstoff">1</strong></div>
      <button id="knappHintDrivstoff" class="rundknapp knapp-hjelp" title="Hjelp meg" aria-label="Hjelp meg">
        <svg width="20" height="20" viewBox="0 0 22 22"><path d="M11,3 a6,6 0 0 1 4,10.5 c-0.8,0.8 -1,1.5 -1,2.5 h-6 c0,-1 -0.2,-1.7 -1,-2.5 A6,6 0 0 1 11,3 Z" fill="#0b1e3d"/><rect x="8.5" y="17" width="5" height="2.4" rx="1" fill="#0b1e3d"/></svg>
      </button>
    </header>

    <main id="brettDrivstoff" class="brett" aria-label="Tanker"></main>

    <p id="tipsDrivstoff" class="tips">Trykk på en tank, og så på en annen 👆</p>

    <nav class="verktoy">
      <button id="knappAngreDrivstoff" class="verktoyknapp glass" aria-label="Angre">
        <svg class="ikon" viewBox="0 0 18 18"><path d="M4,9 a5,5 0 1 1 1.6,3.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M4,9 L4,4 M4,9 L9,9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Angre</span>
      </button>
      <button id="knappStartPaaNyttDrivstoff" class="verktoyknapp glass" aria-label="Start nivået på nytt">
        <svg class="ikon" viewBox="0 0 18 18"><path d="M15,9 A6,6 0 1 1 12.7,4.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M12,2 L13,5 L10,5.6 Z" fill="#fff"/></svg>
        <span>På nytt</span>
      </button>
      <button id="knappNivaaerDrivstoff" class="verktoyknapp glass" aria-label="Velg nivå">
        <svg class="ikon" viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="2.4" rx="1.2" fill="#fff"/><rect x="2" y="7.8" width="14" height="2.4" rx="1.2" fill="#fff"/><rect x="2" y="12.6" width="14" height="2.4" rx="1.2" fill="#fff"/></svg>
        <span>Nivåer</span>
      </button>
    </nav>
  </div>

  <div id="seierDrivstoff" class="overlegg skjult" role="dialog" aria-modal="true" aria-labelledby="seierTittelDrivstoff">
    <div id="konfettiDrivstoff" class="konfetti" aria-hidden="true"></div>
    <div class="kort">
      <div class="stjerner-rad" aria-hidden="true">
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
      </div>
      <h2 id="seierTittelDrivstoff">Bra jobba!</h2>
      <p id="seierTekstDrivstoff">Alle tankene har sitt eget drivstoff.</p>
      <button id="knappNesteDrivstoff" class="storknapp">Neste nivå ▶</button>
      <button id="knappOmIgjenDrivstoff" class="tekstknapp">Spill dette på nytt</button>
    </div>
  </div>

  <div id="velgerDrivstoff" class="overlegg skjult" role="dialog" aria-modal="true" aria-labelledby="velgerTittelDrivstoff">
    <div class="kort bredkort">
      <h2 id="velgerTittelDrivstoff">Velg nivå</h2>
      <div id="nivaalisteDrivstoff" class="nivaaliste"></div>
      <button id="knappLukkVelgerDrivstoff" class="storknapp">Tilbake</button>
    </div>
  </div>
</div>

<!-- ========== STJERNESAMLING ========== -->
<div id="side-stjerner-grid" class="side skjult">
  <div class="stjernefelt"></div>
  <div class="spillside">
    <header class="topp">
      <button id="knappTilbakeGrid" class="rundknapp glass knapp-tilbake" title="Tilbake til rombasen" aria-label="Tilbake til rombasen">
        <svg width="18" height="18" viewBox="0 0 20 20"><path d="M13,3 L5,10 L13,17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="nivaamerke glass" style="flex: 1 1 auto; max-width: none;">Velg stjernetegn</div>
      <div style="width: 48px; flex: 0 0 auto;"></div>
    </header>

    <div id="tegnGrid" class="tegn-grid" aria-label="Stjernetegn"></div>
  </div>
</div>

<div id="side-stjerner-spill" class="side skjult">
  <div class="stjernefelt"></div>
  <div class="spillside">
    <header class="topp">
      <button id="knappTilbakeSpill" class="rundknapp glass knapp-tilbake" title="Velg et annet stjernetegn" aria-label="Velg et annet stjernetegn">
        <svg width="18" height="18" viewBox="0 0 20 20"><path d="M13,3 L5,10 L13,17" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div style="flex: 1 1 auto;"></div>
      <button id="knappHintStjerner" class="rundknapp knapp-hjelp" title="Hjelp meg" aria-label="Hjelp meg">
        <svg width="20" height="20" viewBox="0 0 22 22"><path d="M11,3 a6,6 0 0 1 4,10.5 c-0.8,0.8 -1,1.5 -1,2.5 h-6 c0,-1 -0.2,-1.7 -1,-2.5 A6,6 0 0 1 11,3 Z" fill="#0b1e3d"/><rect x="8.5" y="17" width="5" height="2.4" rx="1" fill="#0b1e3d"/></svg>
      </button>
    </header>

    <h2 id="stjernetegnTittel" class="stjernetegn-tittel"></h2>

    <main id="konstellasjon" class="konstellasjon" aria-label="Stjernebilde"></main>

    <p id="tipsStjerner" class="tips">Trykk på en stjerne, og så på riktig plass i stjernebildet 👆</p>

    <div id="bakkeBoks" class="bakke-boks glass" aria-label="Løse stjerner"></div>

    <nav class="verktoy">
      <button id="knappAngreStjerner" class="verktoyknapp glass" aria-label="Angre">
        <svg class="ikon" viewBox="0 0 18 18"><path d="M4,9 a5,5 0 1 1 1.6,3.6" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M4,9 L4,4 M4,9 L9,9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Angre</span>
      </button>
      <button id="knappStartPaaNyttStjerner" class="verktoyknapp glass" aria-label="Start på nytt">
        <svg class="ikon" viewBox="0 0 18 18"><path d="M15,9 A6,6 0 1 1 12.7,4.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><path d="M12,2 L13,5 L10,5.6 Z" fill="#fff"/></svg>
        <span>På nytt</span>
      </button>
    </nav>
  </div>

  <div id="seierStjerner" class="overlegg skjult" role="dialog" aria-modal="true" aria-labelledby="seierTittelStjerner">
    <div id="glitterStjerner" class="glitter-burst" aria-hidden="true"></div>
    <div id="konfettiStjerner" class="konfetti" aria-hidden="true"></div>
    <div class="kort kort-glitrende">
      <div class="stjerner-rad" aria-hidden="true">
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
        <svg viewBox="0 0 46 46"><path d="M23,3 C25,15 25,15 40,20 C25,25 25,25 23,40 C21,25 21,25 6,20 C21,15 21,15 23,3 Z" fill="#ffc857"/></svg>
      </div>
      <h2 id="seierTittelStjerner">Bra jobba!</h2>
      <p id="seierTekstStjerner">Du fylte hele stjernebildet!</p>
      <button id="knappSpillIgjenStjerner" class="storknapp">Spill igjen</button>
      <button id="knappNyttTegnStjerner" class="tekstknapp">Velg et nytt stjernetegn</button>
    </div>
  </div>
</div>

<script src="js/felles.js"></script>
<script src="js/spill-drivstoff.js"></script>
<script src="js/spill-stjerner.js"></script>
<script src="js/app-drivstoff.js"></script>
<script src="js/app-stjerner.js"></script>
<script src="js/hub.js"></script>
</body>
</html>
